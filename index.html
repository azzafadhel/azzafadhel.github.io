<style>

:root {
  --nav-height:72px;
  --bg:#100E16;
  --surface:#1A1624;
  --surface2:#211A2D;
  --border:#30263F;
  --accent:#C88AD8;
  --accent2:#E1B3EA;
  --accent3:#9A5FAF;
  --text:#F2EAF5;
  --muted:#B7A8C5;
  --gold:#E7C46A;
  --green:#78DDB7;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-height) + 1rem);}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(200,138,216,.08) 0%,transparent 60%),
             radial-gradient(ellipse 60% 50% at 80% 100%,rgba(154,95,175,.06) 0%,transparent 60%);
  pointer-events:none;z-index:0;}

/* ══ NAV ══ */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:.55rem .95rem;padding:.72rem 1rem;background:rgba(16,14,22,.90);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
nav a{color:var(--muted);text-decoration:none;font-size:.79rem;letter-spacing:.065em;text-transform:uppercase;font-weight:500;transition:color .2s;white-space:nowrap;}
nav a:hover,nav a.active{color:var(--accent2);}
.nav-cv{color:var(--accent2)!important;border:1px solid rgba(200,138,216,.35);padding:.22rem .8rem;border-radius:999px;}
.nav-cv:hover{background:rgba(200,138,216,.12);border-color:var(--accent)!important;}

/* ══ HERO ══ */
.hero{position:relative;z-index:1;min-height:auto;display:flex;align-items:center;padding:calc(var(--nav-height) + 2.4rem) 1.5rem 3.4rem;max-width:1440px;margin:0 auto;gap:4.2rem;}

.hero-photo{flex-shrink:0;width:260px;height:260px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);box-shadow:0 0 50px rgba(200,138,216,.32),0 0 90px rgba(200,138,216,.12);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:5rem;}
.hero-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  transform: none;
}
.hero-text h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3.8rem,7vw,6.2rem);font-weight:300;letter-spacing:-.02em;line-height:1.02;margin-bottom:.7rem;}
.hero-text h1 em{font-style:italic;color:var(--accent2);}
.hero-subtitle{font-size:1.05rem;color:var(--accent);letter-spacing:.09em;text-transform:uppercase;margin-bottom:.35rem;font-weight:500;}
.hero-location{font-size:.95rem;color:var(--muted);margin-bottom:1.2rem;}
.hero-links{display:flex;gap:.65rem;flex-wrap:wrap;margin-bottom:.9rem;}
.hero-links a{display:flex;align-items:center;justify-content:center;width:2.65rem;height:2.65rem;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--accent);text-decoration:none;transition:all .2s;}
.hero-links a:hover{border-color:var(--accent);background:rgba(200,138,216,.1);transform:translateY(-2px);}
.cv-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.45rem;border-radius:999px;background:linear-gradient(135deg,rgba(200,138,216,.18),rgba(154,95,175,.12));border:1px solid rgba(200,138,216,.4);color:var(--accent2);text-decoration:none;font-size:.86rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;transition:all .2s;}
.cv-btn:hover{background:rgba(200,138,216,.22);border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 20px rgba(200,138,216,.18);}
.update-badge{font-size:.78rem;color:var(--muted);font-style:italic;display:block;margin-top:.65rem;}

/* ══ PAGE ══ */
.page{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 1.5rem 5rem;display:flex;flex-direction:column;gap:2rem;}

/* ══ ABOUT + EDUCATION ROW ══ */
.about-edu-row{display:grid;grid-template-columns:1.05fr .95fr;gap:2rem;align-items:stretch;}
.about-edu-row .card{height:100%;}

/* ══ CARDS ══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.2rem;transition:border-color .2s;}
.card:hover{border-color:rgba(200,138,216,.22);}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:400;color:var(--text);margin-bottom:1.2rem;padding-bottom:.75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;}
